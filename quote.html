    --f-body:    'DM Sans', system-ui, -apple-system, sans-serif;
  }

  #quote-root, #quote-root *, #quote-root *::before, #quote-root *::after {
    box-sizing: border-box;
  }
  #quote-root { color: var(--text); font-family: var(--f-body); }
  #quote-root button { font: inherit; cursor: pointer; }
  #quote-root a { color: inherit; text-decoration: none; }

  .screen {
    min-height: 100vh;
    padding-bottom: 64px;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(125,163,199,.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(232,201,154,.04) 0%, transparent 60%);
  }

  /* ── Logo bar ─────────────────────────────────────── */
  .logo-bar {
    display:flex; align-items:baseline; gap:8px;
    padding: 22px 32px;
    border-bottom: 1px solid var(--border);
  }
  .logo-text {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: -0.02em;
  }
  .logo-accent { color: var(--accent); font-style: italic; }

  /* ── Buttons ─────────────────────────────────────── */
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    border: none;
    padding: 14px 24px;
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    border-radius: 10px;
    transition: all .15s cubic-bezier(.22,.61,.36,1);
    letter-spacing: 0.005em;
    line-height: 1;
  }
  .btn-primary {
    background: var(--accent);
    color: #0C0F0A;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--text-2);
    border: 1px solid var(--border-2);
  }
  .btn-ghost:hover { background: var(--bg-elev-2); color: var(--text); border-color: var(--border-3); }
  .btn-outline {
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(125,163,199,.35);
  }
  .btn-outline:hover { background: var(--accent-dim); border-color: var(--accent); }
  .btn-lg { padding: 17px 32px; font-size: 16px; }

  /* ── Eyebrow ─────────────────────────────────────── */
  .eyebrow {
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  /* ────────────────────────────────────────────────────────────
     SCREEN 1 — Email
     ──────────────────────────────────────────────────────────── */
  .email-hero { max-width: 720px; margin: 0 auto; padding: 80px 32px 40px; display:flex; flex-direction:column; gap: 44px; }
  .headline {
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    font-variation-settings: 'opsz' 144;
  }
  .hl-warm {
    font-style: italic;
    color: var(--warm);
    font-weight: 400;
  }
  .subhead { font-size: 18px; color: var(--text-2); line-height: 1.55; margin-top: 18px; max-width: 580px; }
  .input-wrap {
    display:flex;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-2);
    background: var(--bg-elev);
    transition: border-color .15s ease;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .email-inp {
    flex:1; background:transparent; border:none; outline:none;
    padding: 16px 20px;
    font-size: 16px;
    color: var(--text);
    font-family: var(--f-body);
  }
  .email-inp::placeholder { color: var(--muted); }
  .email-go { border-radius: 0; }
  .err { color: var(--negative); font-size: 13px; font-family: var(--f-mono); margin-top: 8px; }
  .trust { display:flex; gap:12px; font-size: 13px; color: var(--muted); font-family: var(--f-mono); flex-wrap:wrap; margin-top: 12px; }
  .proof-strip {
    display:flex; align-items:center; gap: 28px;
    padding: 22px 24px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .proof-item { display:flex; flex-direction:column; gap: 3px; }
  .proof-num {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 30px;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .proof-label { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
  .proof-div { width:1px; height:36px; background: var(--border-2); }

  /* ────────────────────────────────────────────────────────────
     SCREEN 2 — Enrichment (brief lookup animation)
     ──────────────────────────────────────────────────────────── */
  .enrich-center { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 70vh; gap: 28px; padding: 0 32px; }
  .enrich-spin {
    width: 56px; height: 56px;
    border: 2px solid rgba(125,163,199,.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  .enrich-text {
    font-family: var(--f-mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .enrich-domain { color: var(--text); }

  /* ────────────────────────────────────────────────────────────
     SCREEN 3 — Confirm Details (the new step)
     ──────────────────────────────────────────────────────────── */
  .confirm-wrap { max-width: 980px; margin: 0 auto; padding: 56px 32px 0; }
  .confirm-head { margin-bottom: 36px; }
  .confirm-h1 {
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(32px, 4vw, 48px);
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-variation-settings: 'opsz' 144;
  }
  .confirm-h1-em { font-style: italic; color: var(--warm); }
  .confirm-sub-line { font-size: 16px; color: var(--text-2); margin-top: 14px; max-width: 620px; line-height: 1.55; }

  .source-card {
    margin-bottom: 24px;
    border-radius: 14px;
    padding: 18px 22px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap:wrap;
  }
  .source-card.found  { border-color: rgba(125,163,199,.25); background: var(--accent-dim); }
  .source-card.unknown{ border-color: rgba(232,201,154,.25); background: var(--warm-dim); }
  .source-left { display:flex; flex-direction:column; gap: 6px; }
  .source-badge {
    display:inline-flex; align-items:center; gap: 8px;
    font-family: var(--f-mono);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent);
  }
  .source-badge.unknown { color: var(--warm); }
  .bdot { width:7px; height:7px; border-radius:50%; background: var(--accent); animation: pulse 1.6s infinite; }
  .bdot.warm { background: var(--warm); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .source-name {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.015em;
  }
  .source-meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

  /* The grid of editable fields — this IS the confirm step */
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 8px;
  }
  .field-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    display:flex; flex-direction:column; gap: 10px;
    transition: border-color .2s ease;
  }
  .field-card:hover { border-color: var(--border-2); }
  .field-card.primary {
    border-color: rgba(125,163,199,.22);
    background: linear-gradient(180deg, rgba(125,163,199,.04) 0%, var(--bg-elev) 60%);
  }
  .field-label {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .field-value-big {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }
  .slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .slider-bounds {
    display:flex; justify-content:space-between;
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
  }
  .field-src {
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 8px; margin-top: 2px;
  }
  .field-select, .field-input-text {
    background: var(--bg-elev-2);
    border: 1px solid var(--border-2);
    border-radius: 9px;
    padding: 11px 14px;
    font-size: 15px;
    color: var(--text);
    font-family: var(--f-body);
    outline: none;
    transition: border-color .15s;
    cursor: pointer;
  }
  .field-select:focus, .field-input-text:focus { border-color: var(--accent); }
  .plan-toggle { display:flex; gap: 8px; }
  .plan-btn {
    flex:1;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 14px;
    transition: all .15s;
  }
  .plan-btn:hover { color: var(--text); border-color: var(--border-2); }
  .plan-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .confirm-footer {
    margin-top: 28px; display:flex; flex-direction:column; gap: 10px; align-items:flex-start;
  }
  .footer-note { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

  /* ────────────────────────────────────────────────────────────
     SCREEN 4 — Quote loading
     ──────────────────────────────────────────────────────────── */
  .loading-center { display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 36px; padding: 80px 32px; }
  .ring-wrap { position:relative; width: 120px; height: 120px; }
  .ring-svg { width: 100%; height: 100%; }
  .ring-pct {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 24px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .steps { display:flex; flex-direction:column; gap: 11px; min-width: 320px; }
  .step {
    display:flex; align-items:center; gap: 11px;
    font-family: var(--f-mono); font-size: 13px;
    color: var(--muted);
    transition: color .3s;
  }
  .step.done { color: var(--accent); }
  .step-icon { width: 16px; text-align: center; }
  .fact-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 26px;
    max-width: 520px; text-align:center;
  }
  .fact-ey {
    font-family: var(--f-mono);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .fact-txt { font-size: 15px; color: var(--text); line-height: 1.55; min-height: 48px; }

  /* ────────────────────────────────────────────────────────────
     SCREEN 5 — Quote dashboard
     ──────────────────────────────────────────────────────────── */
  .q-wrap {
    max-width: 1100px; margin: 32px auto 0; padding: 0 32px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .hero-card {
    grid-column: 1 / -1;
    background: var(--bg-elev);
    border: 1px solid rgba(125,163,199,.28);
    border-radius: 20px;
    padding: 40px 44px;
    background-image: radial-gradient(ellipse 70% 100% at 0% 50%, rgba(125,163,199,.06) 0%, transparent 60%);
  }
  .hero-ey {
    font-family: var(--f-mono);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .hero-num {
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(56px, 9vw, 96px);
    letter-spacing: -0.035em;
    color: var(--accent);
    line-height: 0.95;
    font-variation-settings: 'opsz' 144;
  }
  .hero-unit { font-size: 28px; color: var(--muted); letter-spacing: 0; font-family: var(--f-mono); }
  .hero-pepm { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-top: 14px; }
  .hero-annual {
    font-family: var(--f-display);
    font-style: italic;
    font-size: 20px;
    margin-top: 4px;
    color: var(--warm);
  }
  .hero-disc {
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
    margin-top: 16px;
  }
  .q-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .card-title {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 18px;
    margin-bottom: 16px;
    letter-spacing: -0.015em;
  }
  .bar-list { display:flex; flex-direction:column; gap: 13px; }
  .bar-row { display:flex; align-items:center; gap: 10px; }
  .bar-label { font-family: var(--f-mono); font-size: 12px; color: var(--muted); width: 110px; flex-shrink: 0; }
  .bar-track { flex:1; height: 8px; background: rgba(255,255,255,.05); border-radius: 4px; overflow: hidden; }
  .bar-fill { height:100%; border-radius: 4px; transition: width .8s cubic-bezier(.16,1,.3,1); }
  .bar-val { font-family: var(--f-mono); font-size: 13px; width: 78px; text-align: right; color: var(--text); }

  /* Market Range chart — single band, no named competitors */
  .market-note {
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
    margin-bottom: 18px; line-height: 1.55;
  }
  .market-chart { position:relative; margin: 8px 0 20px; }
  .market-scale {
    position:relative; height: 80px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .market-band {
    position:absolute; top: 50%; transform: translateY(-50%);
    height: 36px;
    background: linear-gradient(90deg,
      rgba(125,163,199,.05) 0%,
      rgba(125,163,199,.22) 30%,
      rgba(125,163,199,.22) 70%,
      rgba(125,163,199,.05) 100%);
    border: 1px solid rgba(125,163,199,.30);
    border-radius: 6px;
  }
  .you-marker {
    position: absolute;
    top: -6px; bottom: -6px;
    width: 2px;
    background: var(--warm);
    box-shadow: 0 0 12px rgba(232,201,154,.4);
  }
  .you-label {
    position: absolute;
    bottom: calc(100% + 6px);
    transform: translateX(-50%);
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--warm);
    white-space: nowrap;
  }
  .market-low-label, .market-high-label {
    position: absolute;
    top: calc(100% + 8px);
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .market-low-label  { left: 0; }
  .market-high-label { right: 0; }
  .market-mid-label  {
    position:absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
  }
  .market-legend {
    display:flex; align-items:center; gap: 20px;
    margin-top: 36px;
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
  }
  .legend-item { display:flex; align-items:center; gap: 8px; }
  .legend-swatch-you   { width: 12px; height: 2px; background: var(--warm); }
  .legend-swatch-range { width: 12px; height: 8px; background: rgba(125,163,199,.22); border: 1px solid rgba(125,163,199,.30); border-radius: 2px; }

  /* CTA panel */
  .cta-panel {
    border: 1px solid rgba(125,163,199,.25);
    border-radius: 16px;
    padding: 30px;
    display:flex; flex-direction:column; gap: 14px;
    background: linear-gradient(180deg, var(--accent-dim) 0%, transparent 100%);
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .cta-panel.show { opacity: 1; transform: none; }
  .cta-title {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.015em;
  }
  .cta-title-em { font-style: italic; color: var(--warm); }
  .cta-body { font-size: 14px; color: var(--text-2); line-height: 1.6; }
  .cta-fine { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
  .submitting-row { display:flex; align-items:center; gap: 10px; font-family: var(--f-mono); font-size: 13px; color: var(--text-2); }
  .spin {
    width: 16px; height: 16px;
    border: 2px solid rgba(125,163,199,.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sub-err { font-family: var(--f-mono); font-size: 12px; color: var(--negative); margin-top: 4px; }

  /* "Worth Reading" */
  .worth-title {
    font-family: var(--f-mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--warm);
    margin-bottom: 16px;
  }
  .res-list { display:flex; flex-direction:column; gap: 16px; }
  .res-item { display:flex; gap: 14px; align-items:flex-start; cursor:pointer; }
  .res-item:hover .res-title { color: var(--accent); }
  .res-emoji { font-size: 19px; flex-shrink:0; margin-top: 1px; }
  .res-title { font-size: 14px; font-weight: 600; color: var(--text); transition: color .15s; }
  .res-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

  /* ────────────────────────────────────────────────────────────
     SCREEN 6 — Final confirmation
     ──────────────────────────────────────────────────────────── */
  .final-wrap { max-width: 640px; margin: 0 auto; padding: 80px 32px; display:flex; flex-direction:column; align-items:center; gap: 32px; text-align:center; }
  .final-ring {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 2px solid rgba(125,163,199,.35);
    display:flex; align-items:center; justify-content:center;
    font-size: 32px; color: var(--accent);
  }
  .final-headline {
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(32px, 5vw, 48px);
    letter-spacing: -0.025em;
    line-height: 1.05;
    font-variation-settings: 'opsz' 144;
  }
  .final-name-em { font-style: italic; color: var(--warm); }
  .final-sub { font-size: 16px; color: var(--text-2); line-height: 1.65; max-width: 520px; }
  .final-sub strong { color: var(--text); font-weight: 600; }
  .final-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px;
    width: 100%;
    text-align: left;
    display:flex; flex-direction:column; gap: 12px;
  }
  .final-card-title {
    font-family: var(--f-mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .final-item { display:flex; align-items:flex-start; gap: 12px; font-size: 14px; color: var(--text-2); line-height: 1.5; }
  .final-check { color: var(--accent); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .final-data-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .final-data-row { display:flex; flex-direction:column; gap: 3px; padding: 8px 0; }
  .final-data-key { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .final-data-val { font-size: 14px; color: var(--text); font-weight: 500; }
  .final-actions { display:flex; gap: 10px; flex-wrap:wrap; justify-content:center; }
  .simulated-badge {
    font-family: var(--f-mono); font-size: 11px; color: var(--muted);
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 14px;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  @media (max-width: 720px) {
    .field-grid, .q-wrap { grid-template-columns: 1fr; }
    .hero-card { grid-column: 1; padding: 28px 24px; }
    .proof-strip { flex-wrap: wrap; }
    .source-card { flex-direction: column; align-items: flex-start; }
    .final-data-grid { grid-template-columns: 1fr; }
